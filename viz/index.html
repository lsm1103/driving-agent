<title>驱动账簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
:root{
  --ground:#F1F4F0; --bar:#E5EBE3; --card:#F7F9F6;
  --ink:#1B2430; --soft:#5C6873; --faint:#98A29A;
  --rule:#C6D0C7; --rule-soft:#DCE3DB;
  --accent:#1D4E89; --accent-wash:#DDE6F1;
  --closed:#2E6B4E; --dropped:#9A5638; --ghost:#CBD3CB;
  --zone:#C3CEC4; --zone-a:.30;
  --ui:'IBM Plex Sans','Noto Sans SC',system-ui,sans-serif;
  --voice:'Noto Serif SC',Georgia,serif;
  --num:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F141A; --bar:#161D25; --card:#141B23;
  --ink:#DCE4EC; --soft:#8794A2; --faint:#5D6874;
  --rule:#253039; --rule-soft:#1C242C;
  --accent:#74A9DE; --accent-wash:#1B2A3A;
  --closed:#58BC8C; --dropped:#D2865C; --ghost:#2A343D;
  --zone:#8FA3B8; --zone-a:.13;
}}
:root[data-theme="dark"]{
  --ground:#0F141A; --bar:#161D25; --card:#141B23;
  --ink:#DCE4EC; --soft:#8794A2; --faint:#5D6874;
  --rule:#253039; --rule-soft:#1C242C;
  --accent:#74A9DE; --accent-wash:#1B2A3A;
  --closed:#58BC8C; --dropped:#D2865C; --ghost:#2A343D;
  --zone:#8FA3B8; --zone-a:.13;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);
     font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1140px;margin:0 auto;padding:28px 22px 80px}
.lab{font-family:var(--num);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
     color:var(--soft);font-weight:500}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ── 抬头：一句话总账 ── */
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:22px 30px;
       padding-bottom:18px;border-bottom:2px solid var(--ink);margin-bottom:26px}
h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-weight:400;font-size:12.5px;color:var(--soft);
         letter-spacing:0;margin-top:3px}
.tally{display:flex;gap:26px;margin-left:auto;flex-wrap:wrap}
.tally div{text-align:right}
.tally b{display:block;font-family:var(--num);font-size:25px;font-weight:500;line-height:1.1;
         font-variant-numeric:tabular-nums}
.t-cl b{color:var(--closed)} .t-ab b{color:var(--dropped)}

/* ── 轨道 ── */
.rail{margin-bottom:30px}
svg{display:block;width:100%;height:auto;overflow:visible}
.daycol{cursor:pointer}
.daycol rect.hit{fill:transparent}
.daycol:hover rect.hit,.daycol:focus-visible rect.hit{fill:var(--accent-wash)}
.daycol:focus-visible{outline:none}
.daycol.on rect.hit{fill:var(--accent-wash)}

/* ── 日头 ── */
.dayhead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
         padding-bottom:8px;border-bottom:1px solid var(--ink);margin-bottom:0}
.dayhead h2{font-family:var(--num);font-size:19px;font-weight:500;margin:0;
            font-variant-numeric:tabular-nums}
.dayhead .date{font-family:var(--num);font-size:12px;color:var(--soft)}
.chips{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
.chip{font-family:var(--num);font-size:11px;padding:2px 9px;border:1px solid var(--rule);
      border-radius:2px;color:var(--soft);font-variant-numeric:tabular-nums}
.chip.cl{color:var(--closed);border-color:var(--closed)}
.chip.ab{color:var(--dropped);border-color:var(--dropped)}

/* ── 分节 ── */
section{margin-top:30px}
.sechead{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.sechead .n{font-family:var(--num);font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.slots{margin-left:auto;display:flex;gap:3px;align-items:center}
.slots i{width:16px;height:16px;border:1px solid var(--rule);border-radius:2px;display:block}
.slots i.f{background:var(--accent);border-color:var(--accent)}
.pips{display:flex;gap:2px;padding-top:5px}
.pips i{width:8px;height:8px;border:1px solid var(--accent);border-radius:1px;display:block}
.pips i.f{background:var(--accent)}
.row.off .pips i{border-color:var(--faint)}
.touch{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.touch b{font-family:var(--num);font-size:10.5px;font-weight:500;padding:2px 7px;
         border:1px solid var(--closed);color:var(--closed);border-radius:2px;cursor:help}
.row.off .touch b{border-color:var(--faint);color:var(--faint)}
.act{font-weight:600;font-size:14.5px;margin-bottom:5px;line-height:1.55}

/* ── 信号网格：每一格 = 一次判断 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:3px;
      padding:13px;background:var(--card);border:1px solid var(--rule-soft);border-radius:2px}
.cell{aspect-ratio:1;border:0;padding:0;border-radius:1px;cursor:pointer;
      background:var(--ghost);transition:transform .1s}
.cell.on{background:var(--accent)}
.cell:hover,.cell:focus-visible{transform:scale(1.55);outline:none;
      box-shadow:0 0 0 1.5px var(--ink)}
.cell.sel{transform:scale(1.55);box-shadow:0 0 0 1.5px var(--ink)}

/* ── 账页行 ── */
.rows{border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:78px 1fr;gap:16px;padding:11px 12px;
     border-bottom:1px solid var(--rule-soft);align-items:start}
.row{grid-template-columns:88px 1fr}
.row:nth-child(even){background:var(--bar)}
.row .mark{font-family:var(--num);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
           padding-top:3px;white-space:nowrap}
.row>div:last-child{max-width:66ch}
.row .t{font-weight:500;font-size:14px;margin-bottom:5px}
.row .why{font-family:var(--voice);font-size:13.5px;line-height:1.72;color:var(--soft)}
.row .cc{font-family:var(--voice);font-size:13px;line-height:1.7;margin-top:7px;
         padding-left:12px;border-left:2px solid var(--closed);color:var(--ink)}
.row.off .t{color:var(--faint);font-weight:400}
.row.off .mark{color:var(--faint)}
.m-on{color:var(--accent)} .m-cl{color:var(--closed)} .m-ab{color:var(--dropped)}

/* 详情：点格子后出现 */
#detail{margin-top:0;border:1px solid var(--rule);border-top:0;border-radius:0 0 2px 2px;
        background:var(--card);padding:0;overflow:hidden}
#detail .row{border-bottom:0}
#detail:empty{display:none}

/* 债：预测 */
.debt{display:grid;grid-template-columns:96px 1fr auto;gap:16px;padding:12px;
      border-bottom:1px solid var(--rule-soft);align-items:start}
.debt:nth-child(even){background:var(--bar)}
.debt .claim{font-family:var(--voice);font-size:13.5px;line-height:1.72;max-width:66ch}
.debt .due{font-family:var(--num);font-size:11px;color:var(--dropped);white-space:nowrap;
           text-align:right;font-variant-numeric:tabular-nums}
.debt .conf{font-family:var(--num);font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
.empty{font-family:var(--voice);color:var(--faint);font-size:13.5px;padding:14px 12px;
       border-bottom:1px solid var(--rule-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:620px){
  .row{grid-template-columns:60px 1fr;gap:11px}
  .debt{grid-template-columns:1fr;gap:6px}
  .debt .due{text-align:left}
  .tally{margin-left:0;gap:18px}
}
</style>

<div class="wrap">
<header>
  <h1>驱动账簿<small>一个没人派活的 Agent，八天里每一次判断</small></h1>
  <div class="tally">
    <div><b class="num" id="t-sig"></b><span class="lab">信号</span></div>
    <div><b class="num" id="t-reg"></b><span class="lab">登记</span></div>
    <div class="t-cl"><b class="num" id="t-cl"></b><span class="lab">闭合</span></div>
    <div class="t-ab"><b class="num" id="t-ab"></b><span class="lab">放弃</span></div>
  </div>
</header>

<div class="rail"><svg id="rail" viewBox="0 0 1000 210" role="img" aria-label="每日进出与预测到期"></svg></div>

<div class="dayhead">
  <h2 id="d-n"></h2><span class="date" id="d-date"></span>
  <div class="chips" id="d-chips"></div>
</div>

<section>
  <div class="sechead"><span class="lab">筛选</span><span class="n" id="s-n"></span></div>
  <div class="grid" id="grid"></div>
  <div id="detail"></div>
</section>

<section>
  <div class="sechead"><span class="lab">取舍</span><span class="n" id="c-n"></span>
    <div class="slots" id="slots" aria-label="当日行动槽"></div></div>
  <div class="rows" id="cands"></div>
</section>

<section>
  <div class="sechead"><span class="lab">结果</span><span class="n" id="r-n"></span></div>
  <div class="rows" id="results"></div>
</section>
</div>

  const L = 30, R = 992, W = (R - L) / LAST;
  const x = d => L + (d - 0.5) * W;
  const BASE = VH - 14, TOP = VH * .46, ARC = VH * .35;   // 堆叠区底 / 顶 / 弧区基线
  const maxTot = days[days.length - 1].bal.open + D.total.cl + D.total.ab;
  const h = v => v / maxTot * (BASE - TOP);
  let s = '';

  // 回放从未抵达的区域
  s += `<rect x="${x(days.length) + W/2}" y="6" width="${R - x(days.length) - W/2}" height="${BASE - 6}"
         fill="var(--zone)" opacity="var(--zone-a)"/>`;

  s += `<line x1="${x(days.length) + W/2}" y1="6" x2="${x(days.length) + W/2}" y2="${BASE}"
         stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 3" opacity=".45"/>`;

  // 预测的弧：从做出那天，落到到期那天
  days.forEach(dd => dd.pred.forEach(p => {
    const x1 = x(dd.n), x2 = x(p.due_day), mid = (x1 + x2) / 2;
    const lift = Math.min(ARC - 10, 10 + Math.abs(x2 - x1) * .32);
    s += `<path d="M${x1} ${ARC} Q${mid} ${ARC - lift * 2} ${x2} ${ARC}" fill="none"
           stroke="var(--dropped)" stroke-width="1.1" opacity=".62"/>`;
    s += `<circle cx="${x1}" cy="${ARC}" r="2.4" fill="var(--dropped)"/>`;
    s += `<circle cx="${x2}" cy="${ARC}" r="2.4" fill="none" stroke="var(--dropped)" stroke-width="1.1"/>`;
  }));
  s += `<line x1="${L}" y1="${ARC}" x2="${R}" y2="${ARC}" stroke="var(--rule)" stroke-width="1"/>`;

  // 账本堆叠：未闭合 / 闭合 / 放弃（累计）
  let cl = 0, ab = 0;
  days.forEach(dd => {
    cl += dd.bal.cl; ab += dd.bal.ab;
    const bw = W * .56, bx = x(dd.n) - bw / 2;
    let y = BASE;
    [[ab, 'var(--dropped)'], [cl, 'var(--closed)'], [dd.bal.open, 'var(--accent)']]
      .forEach(([v, c]) => { if (v > 0) { y -= h(v); s += `<rect x="${bx}" y="${y}" width="${bw}" height="${h(v)}" fill="${c}"/>`; } });
  });
  s += `<line x1="${L}" y1="${BASE}" x2="${R}" y2="${BASE}" stroke="var(--ink)" stroke-width="1.2"/>`;

  // 天号 + 命中区
  for (let d = 1; d <= LAST; d++) {
    const real = d <= days.length;
    s += `<text x="${x(d)}" y="${BASE + 15}" text-anchor="middle" font-family="var(--num)"
           font-size="10" fill="${real ? 'var(--soft)' : 'var(--faint)'}"
           opacity="${real ? 1 : .55}">${d}</text>`;
    if (real) s += `<g class="daycol" data-d="${d}" tabindex="0" role="button" aria-label="第 ${d} 天">
           <rect class="hit" x="${x(d) - W/2}" y="${TOP - 8}" width="${W}" height="${BASE - TOP + 12}"/></g>`;
  }
  const svg = $('rail');
  svg.setAttribute('viewBox', `0 0 1000 ${VH + 6}`);
  svg.innerHTML = s;
  svg.querySelectorAll('.daycol').forEach(g => {
    const go = () => pick(+g.dataset.d);
    g.addEventListener('click', go);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}

/* ── 一天 ── */
function pick(n) {
  cur = n; selCell = null;
  const d = days[n - 1];
  document.querySelectorAll('.daycol').forEach(g => g.classList.toggle('on', +g.dataset.d === n));

  $('d-n').textContent = '第 ' + n + ' 天';
  $('d-date').textContent = d.date;
  const c = [];
  if (d.bal.cl) c.push(`<span class="chip cl">闭合 ${d.bal.cl}</span>`);
  if (d.bal.ab) c.push(`<span class="chip ab">放弃 ${d.bal.ab}</span>`);
  if (d.pred.length) c.push(`<span class="chip">留债 ${d.pred.length}</span>`);
  c.push(`<span class="chip">账上 ${d.bal.open}</span>`);
  $('d-chips').innerHTML = c.join('');

  // 筛选：每一格是一次判断
  $('s-n').textContent = `${d.sig.length} 条 · 留 ${d.bal.reg}`;
  $('grid').innerHTML = d.sig.map((s, i) =>
    `<button class="cell${s.on ? ' on' : ''}" data-i="${i}"
      aria-label="${esc(s.t).slice(0,60)}"></button>`).join('');
  $('grid').querySelectorAll('.cell').forEach(b =>
    b.addEventListener('click', () => showCell(+b.dataset.i, b)));
  $('detail').innerHTML = '';

  // 取舍：预算用满是看出来的，不是读出来的
  const kept = d.cand.filter(x => x.on).length;
  $('c-n').textContent = `${d.cand.length} 个候选 · 选 ${kept}`;
  $('slots').innerHTML = Array.from({length: 5},
    (_, i) => `<i class="${i < d.used ? 'f' : ''}"></i>`).join('');
  $('cands').innerHTML = d.cand.map(x => {
    // 只在原文自带的断点处切，不改一个字；切不出短动作就整段平铺，
    // 整段加粗等于没有重点。
    const cut = [x.p.indexOf('：'), x.p.indexOf('，')]
      .filter(i => i > 6 && i <= 32).sort((a, b) => a - b)[0];
    const head = cut ? x.p.slice(0, cut) : '';
    const rest = cut ? x.p.slice(cut + 1) : x.p;
    const pips = Array.from({length: x.cost},
      () => `<i class="${x.on ? 'f' : ''}"></i>`).join('');
    const touch = (x.cl || []).map(id =>
      `<b title="${esc(D.loops[id] || id)}">${id}</b>`).join('');
    return `<div class="row${x.on ? '' : ' off'}">
      <div class="mark"><div class="pips" aria-label="${x.cost} 槽">${pips}</div></div>
      <div>${head ? `<div class="act">${esc(head)}</div>` : ''}
        <div class="why">${esc(rest)}</div>
        ${touch ? `<div class="touch">${touch}</div>` : ''}
      </div></div>`;
  }).join('');

  // 结果
  const r = [];
  d.closed.forEach(x => r.push(`<div class="row"><div class="mark m-cl">闭合</div>
    <div><div class="t">${esc(x.statement)}</div></div></div>`));
  d.dropped.forEach(x => r.push(`<div class="row"><div class="mark m-ab">放弃</div>
    <div><div class="t">${esc(x.statement)}</div>
    <div class="why">${esc(x.abandon_reason)}</div></div></div>`));
  d.pred.forEach(p => r.push(`<div class="debt">
    <div><div class="mark m-ab">留债</div><div class="conf">置信 ${p.confidence.toFixed(2)}</div></div>
    <div><div class="claim">${esc(p.claim)}</div></div>
    <div class="due">第 ${p.due_day} 天到期<br>${p.due_day > days.length ? '窗口外' : ''}</div>
  </div>`));
  $('r-n').textContent = `${d.bal.cl + d.bal.ab + d.pred.length} 项`;
  $('results').innerHTML = r.length ? r.join('')
    : `<div class="empty">这一天没有任何东西被闭合、放弃，也没有留下债。</div>`;
}

function showCell(i, btn) {
  const s = days[cur - 1].sig[i];
  document.querySelectorAll('.cell.sel').forEach(b => b.classList.remove('sel'));
  if (selCell === i) { selCell = null; $('detail').innerHTML = ''; return; }
  selCell = i; btn.classList.add('sel');
  $('detail').innerHTML = `<div class="row${s.on ? '' : ' off'}">
    <div class="mark ${s.on ? 'm-on' : ''}">${s.on ? '登记 · ' + s.k : '忽略'}</div>
    <div><div class="t">${esc(s.t)}</div>
      <div class="why">${esc(s.r)}</div>
      ${s.cc ? `<div class="cc">闭合条件 ── ${esc(s.cc)}</div>` : ''}
    </div></div>`;
}

function draw(){ rail(); document.querySelectorAll('.daycol')
  .forEach(g => g.classList.toggle('on', +g.dataset.d === cur)); }
draw(); pick(4);
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(draw, 160); });

</script>
